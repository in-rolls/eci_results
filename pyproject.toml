[project]
name = "eci-results"
version = "0.1.0"
description = "Lok Sabha 2024 and assembly 2024-2026 candidate results in TCPD's Lok Dhaba column layout"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["India", "elections", "Lok Sabha", "assembly", "ECI", "TCPD"]
dependencies = [
    "beautifulsoup4>=4.13",
    "numpy>=2",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pdfplumber>=0.11.10",
    "requests>=2.32",
    "tenacity>=9",
]

[project.urls]
Repository = "https://github.com/in-rolls/eci_results"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eci_results"]

[dependency-groups]
dev = ["black>=25", "isort>=6", "flake8>=7", "pytest>=8"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
